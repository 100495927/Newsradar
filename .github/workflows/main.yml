name: NewsRadar Sprint 1 CI

on:
  push:
    branches: [ main, master, develop ]
    # Evita ejecutar el CI si solo cambias documentación o usas [skip ci] en el mensaje
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Crear .env temporal desde el example
        run: cp .env.example .env

      - name: Build y Up de Docker
        run: docker compose up -d --build

      - name: Esperar a que los servicios estén Healthy
        # En lugar de un sleep fijo, Docker esperará a los healthchecks del compose
        run: |
          echo "Esperando a que los contenedores estén listos..."
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' newsradar-backend)" == "healthy" ]; then
              echo "Backend listo!"
              exit 0
            fi
            sleep 10
          done
          echo "Error: El backend no llegó a estar healthy"
          docker ps -a
          docker logs newsradar-backend
          exit 1

      - name: Ejecutar Suite de Tests Completa
        run: |
          # Importante: Usamos la ruta correcta donde están tus tests reales
          docker exec \
            -e PYTHONPATH=. \
            newsradar-backend pytest backend/tests/