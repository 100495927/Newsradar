<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title desc">
  <title id="title">NewsRadar - Imagen de arquitectura UML</title>
  <desc id="desc">Diagrama de arquitectura del proyecto NewsRadar con frontend, backend, workers, MongoDB, shared y servicios externos.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .zone { fill: #eef2f7; stroke: #94a3b8; stroke-width: 1.5; }
      .zoneTitle { fill: #334155; font-family: Arial, sans-serif; font-size: 18px; font-weight: 800; }
      .box { fill: #ffffff; stroke: #24324a; stroke-width: 1.5; }
      .boxSoft { fill: #fffdf7; stroke: #a16207; stroke-width: 1.4; }
      .boxData { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; }
      .boxExternal { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .header { fill: #24324a; }
      .headerSoft { fill: #a16207; }
      .headerData { fill: #15803d; }
      .headerExternal { fill: #475569; }
      .hText { fill: #ffffff; font-family: Arial, sans-serif; font-size: 15px; font-weight: 800; }
      .text { fill: #1f2937; font-family: Arial, sans-serif; font-size: 13px; }
      .small { fill: #475569; font-family: Arial, sans-serif; font-size: 12px; }
      .title { fill: #111827; font-family: Arial, sans-serif; font-size: 30px; font-weight: 900; }
      .subtitle { fill: #475569; font-family: Arial, sans-serif; font-size: 14px; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.7; marker-end: url(#arrow); }
      .arrowDashed { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 7 5; marker-end: url(#arrow2); }
      .label { fill: #334155; font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .pill { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1; }
      .pillText { fill: #075985; font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1320"/>
  <text class="title" x="60" y="54">NewsRadar - Arquitectura del Proyecto</text>
  <text class="subtitle" x="60" y="78">Vista de despliegue Docker y componentes logicos principales del sistema</text>

  <!-- External actors -->
  <rect class="boxExternal" x="60" y="140" width="240" height="110" rx="8"/>
  <rect class="headerExternal" x="60" y="140" width="240" height="34" rx="8"/>
  <text class="hText" x="78" y="162">USUARIO</text>
  <text class="text" x="78" y="198">Navegador web</text>
  <text class="small" x="78" y="220">HTTP UI</text>

  <rect class="boxExternal" x="1580" y="150" width="250" height="112" rx="8"/>
  <rect class="headerExternal" x="1580" y="150" width="250" height="34" rx="8"/>
  <text class="hText" x="1598" y="172">SERVICIOS EXTERNOS</text>
  <text class="text" x="1598" y="208">Fuentes RSS publicas</text>
  <text class="text" x="1598" y="230">Servidor SMTP</text>

  <!-- Docker zone -->
  <rect class="zone" x="350" y="120" width="1170" height="1010" rx="14"/>
  <text class="zoneTitle" x="375" y="152">Docker Compose - newsradar_net</text>

  <!-- Frontend -->
  <g id="frontend">
    <rect class="box" x="420" y="200" width="300" height="185" rx="8"/>
    <rect class="header" x="420" y="200" width="300" height="36" rx="8"/>
    <text class="hText" x="438" y="223">FRONTEND</text>
    <text class="text" x="438" y="260">React 19 + Vite</text>
    <text class="text" x="438" y="282">React Router</text>
    <text class="text" x="438" y="304">AuthContext + JWT localStorage</text>
    <text class="text" x="438" y="326">Pages y components UI</text>
    <rect class="pill" x="438" y="344" width="96" height="24" rx="12"/>
    <text class="pillText" x="456" y="361">:5173</text>
  </g>

  <!-- Backend -->
  <g id="backend">
    <rect class="box" x="820" y="185" width="380" height="430" rx="8"/>
    <rect class="header" x="820" y="185" width="380" height="36" rx="8"/>
    <text class="hText" x="838" y="208">BACKEND API</text>
    <text class="text" x="838" y="246">FastAPI + PyMongo</text>
    <text class="text" x="838" y="268">CORS + Healthcheck</text>
    <text class="text" x="838" y="290">/api/v1</text>
    <rect class="pill" x="1085" y="236" width="96" height="24" rx="12"/>
    <text class="pillText" x="1103" y="253">:8000</text>

    <rect class="boxSoft" x="845" y="325" width="150" height="54" rx="6"/>
    <text class="text" x="860" y="348">auth.routes</text>
    <text class="small" x="860" y="366">login, users</text>

    <rect class="boxSoft" x="1025" y="325" width="150" height="54" rx="6"/>
    <text class="text" x="1040" y="348">alertas.routes</text>
    <text class="small" x="1040" y="366">CRUD alertas</text>

    <rect class="boxSoft" x="845" y="400" width="150" height="54" rx="6"/>
    <text class="text" x="860" y="423">rss.routes</text>
    <text class="small" x="860" y="441">fuentes/canales</text>

    <rect class="boxSoft" x="1025" y="400" width="150" height="54" rx="6"/>
    <text class="text" x="1040" y="423">notificaciones</text>
    <text class="small" x="1040" y="441">buzon interno</text>

    <rect class="boxSoft" x="845" y="475" width="150" height="54" rx="6"/>
    <text class="text" x="860" y="498">category.routes</text>
    <text class="small" x="860" y="516">catalogo IPTC</text>

    <rect class="boxSoft" x="1025" y="475" width="150" height="54" rx="6"/>
    <text class="text" x="1040" y="498">stats.service</text>
    <text class="small" x="1040" y="516">dashboard</text>

    <rect class="boxSoft" x="845" y="550" width="330" height="42" rx="6"/>
    <text class="text" x="860" y="576">store.py + dependencies.py</text>
  </g>

  <!-- Workers -->
  <g id="workers">
    <rect class="box" x="420" y="470" width="300" height="250" rx="8"/>
    <rect class="header" x="420" y="470" width="300" height="36" rx="8"/>
    <text class="hText" x="438" y="493">RSS-WORKER</text>
    <text class="text" x="438" y="530">python -m rss_worker</text>
    <text class="text" x="438" y="552">Lee canales RSS activos</text>
    <text class="text" x="438" y="574">Descarga feeds externos</text>
    <text class="text" x="438" y="596">Parsea entradas RSS</text>
    <text class="text" x="438" y="618">Inserta rss_entradas</text>
    <rect class="pill" x="438" y="642" width="176" height="24" rx="12"/>
    <text class="pillText" x="456" y="659">intervalo 300s</text>

    <rect class="box" x="420" y="790" width="300" height="250" rx="8"/>
    <rect class="header" x="420" y="790" width="300" height="36" rx="8"/>
    <text class="hText" x="438" y="813">ALERT-WORKER</text>
    <text class="text" x="438" y="850">python -m alert_worker</text>
    <text class="text" x="438" y="872">Procesa alertas vencidas</text>
    <text class="text" x="438" y="894">Busca coincidencias RSS</text>
    <text class="text" x="438" y="916">Crea notifications</text>
    <text class="text" x="438" y="938">Entrega email pendiente</text>
    <rect class="pill" x="438" y="962" width="176" height="24" rx="12"/>
    <text class="pillText" x="456" y="979">intervalo 60s</text>
  </g>

  <!-- Shared -->
  <g id="shared">
    <rect class="boxSoft" x="820" y="700" width="380" height="210" rx="8"/>
    <rect class="headerSoft" x="820" y="700" width="380" height="36" rx="8"/>
    <text class="hText" x="838" y="723">SHARED</text>
    <text class="text" x="838" y="760">shared.mongo.Database</text>
    <text class="text" x="838" y="782">colecciones: schemas + indices</text>
    <text class="text" x="838" y="804">bootstrap_spec.py</text>
    <text class="text" x="838" y="826">iptc_catalog.py</text>
    <text class="text" x="838" y="848">utils.cron</text>
    <text class="text" x="838" y="870">utils.email_sender</text>
  </g>

  <!-- MongoDB -->
  <g id="mongo">
    <rect class="boxData" x="1255" y="520" width="230" height="390" rx="8"/>
    <rect class="headerData" x="1255" y="520" width="230" height="36" rx="8"/>
    <text class="hText" x="1273" y="543">MONGODB 8.2</text>
    <text class="text" x="1273" y="580">DB: newsradar</text>
    <text class="text" x="1273" y="612">users</text>
    <text class="text" x="1273" y="634">information_sources</text>
    <text class="text" x="1273" y="656">rss_channels</text>
    <text class="text" x="1273" y="678">rss_entradas</text>
    <text class="text" x="1273" y="700">rss_categorias_iptc</text>
    <text class="text" x="1273" y="722">alerts</text>
    <text class="text" x="1273" y="744">notifications</text>
    <text class="text" x="1273" y="766">stats</text>
    <text class="text" x="1273" y="788">counters</text>
    <text class="text" x="1273" y="810">user_sessions</text>
    <rect class="pill" x="1273" y="842" width="112" height="24" rx="12"/>
    <text class="pillText" x="1291" y="859">:27017</text>
  </g>

  <!-- Bootstrap / volumes -->
  <g id="bootstrap">
    <rect class="boxSoft" x="1255" y="950" width="230" height="120" rx="8"/>
    <rect class="headerSoft" x="1255" y="950" width="230" height="36" rx="8"/>
    <text class="hText" x="1273" y="973">BOOTSTRAP</text>
    <text class="text" x="1273" y="1010">init-mongo.sh</text>
    <text class="text" x="1273" y="1032">init-mongo.js</text>
    <text class="text" x="1273" y="1054">seed-mongo.js</text>

    <rect class="boxData" x="1255" y="1095" width="230" height="70" rx="8"/>
    <text class="text" x="1273" y="1126">./data/mongodb/data</text>
    <text class="text" x="1273" y="1148">./data/mongodb/configdb</text>
  </g>

  <!-- Disabled services -->
  <g id="disabled">
    <rect class="boxExternal" x="420" y="1085" width="780" height="60" rx="8"/>
    <text class="text" x="438" y="1118">Elasticsearch y Kibana aparecen documentados, pero estan desactivados en docker-compose.yml.</text>
  </g>

  <!-- Arrows -->
  <polyline class="arrow" points="300,195 420,195"/>
  <text class="label" x="326" y="183">HTTP UI</text>

  <polyline class="arrow" points="720,292 820,292"/>
  <text class="label" x="738" y="280">REST /api/v1</text>

  <polyline class="arrow" points="1200,570 1255,570"/>
  <text class="label" x="1207" y="558">PyMongo</text>

  <polyline class="arrow" points="720,610 1255,610"/>
  <text class="label" x="925" y="598">lee canales / escribe entradas</text>

  <polyline class="arrow" points="720,900 1255,800"/>
  <text class="label" x="890" y="860">alertas + notificaciones</text>

  <polyline class="arrow" points="1200,805 1255,805"/>
  <text class="label" x="1207" y="793">schemas</text>

  <polyline class="arrow" points="720,545 1580,200"/>
  <text class="label" x="1225" y="340">HTTP RSS</text>

  <polyline class="arrow" points="720,920 1580,230"/>
  <text class="label" x="1260" y="650">SMTP email</text>

  <polyline class="arrowDashed" points="1370,950 1370,910"/>
  <text class="label" x="1382" y="936">init</text>

  <polyline class="arrowDashed" points="1370,910 1370,1095"/>
  <text class="label" x="1382" y="1110">volumenes</text>

  <polyline class="arrowDashed" points="820,760 720,690"/>
  <text class="label" x="738" y="735">usa</text>

  <polyline class="arrowDashed" points="820,850 720,940"/>
  <text class="label" x="748" y="910">usa</text>

  <polyline class="arrowDashed" points="1010,615 1010,700"/>
  <text class="label" x="1024" y="668">usa shared</text>

  <!-- Legend -->
  <rect class="boxExternal" x="60" y="1185" width="1770" height="70" rx="8"/>
  <line class="arrow" x1="85" y1="1215" x2="160" y2="1215"/>
  <text class="small" x="175" y="1220">Flujo principal de ejecucion o datos</text>
  <line class="arrowDashed" x1="420" y1="1215" x2="495" y2="1215"/>
  <text class="small" x="510" y="1220">Dependencia auxiliar, bootstrap o volumen</text>
  <text class="small" x="830" y="1220">Servicios activos: frontend, backend, mongodb, rss-worker y alert-worker.</text>
</svg>
