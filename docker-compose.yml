services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newsradar-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${FRONTEND_NODE_ENV:-development}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      BACKEND_URL: http://backend:8000
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    ports:
      - "${FRONTEND_EXPOSE_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - newsradar_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: newsradar-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PYTHONUNBUFFERED: "1"
      # URI usada por el backend para conectar con Mongo usando el usuario de aplicacion.
      MONGODB_URI: mongodb://${MONGO_APP_USER:-newsradar_app}:${MONGO_APP_PASSWORD:-change_me_app_pwd}@${MONGO_HOST:-mongodb}:${MONGO_PORT:-27017}/${MONGO_APP_DB:-newsradar}?authSource=${MONGO_APP_DB:-newsradar}
      MONGO_DB_NAME: ${MONGO_APP_DB:-newsradar}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_INDEX_ENTRADAS: ${ELASTICSEARCH_INDEX_ENTRADAS:-rss_entradas_idx}
      ELASTICSEARCH_INDEX_FUENTES: ${ELASTICSEARCH_INDEX_FUENTES:-rss_fuentes_idx}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD} 
      MAIL_FROM: ${MAIL_FROM}
    ports:
      - "${BACKEND_EXPOSE_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      rss-worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s
    networks:
      - newsradar_net
    volumes:
      - ./backend:/app/backend        # Sincroniza lógica
      - ./shared:/app/shared  

  mongodb:
    image: mongo:8.2
    container_name: newsradar-mongodb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-newsradar_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me_root_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-admin}
      MONGO_APP_USER: ${MONGO_APP_USER:-newsradar_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-change_me_app_pwd}
      MONGO_APP_DB: ${MONGO_APP_DB:-newsradar}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./data/mongodb/data:/data/db
      - ./data/mongodb/configdb:/data/configdb
      - ./scripts/mongo/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
      - ./scripts/mongo/init-mongo.js:/opt/newsradar/init-mongo.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1})'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - newsradar_net

  rss-worker:
    build:
      context: .
      dockerfile: rss-worker/Dockerfile
    container_name: newsradar-rss-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      RSS_WORKER_INTERVAL_SECONDS: "60"
      RSS_WORKER_RUN_ONCE: "false"
      RSS_WORKER_UVICORN_PORT: "8000"
    command: ["python", "/app/rss-worker/rss_worker/main.py"]
    healthcheck:
      test: ["CMD", "python", "/app/rss-worker/rss_worker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${RSS_WORKER_UVICORN_EXPOSE_PORT:-12670}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - newsradar_net

  alert-worker:
    build:
      context: .
      dockerfile: rss-worker/Dockerfile
    container_name: newsradar-alert-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      ALERT_WORKER_INTERVAL_SECONDS: "60"
      ALERT_WORKER_RUN_ONCE: "false"
    command: ["python", "/app/rss-worker/alert_worker/main.py"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from shared.mongo import Database; Database().ping()",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - newsradar_net

